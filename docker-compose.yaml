services:
  prometheus:
    image: prom/prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus:/prometheus

  worker:
    build: .
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 64MB
    ports:
      - 8080:8080

volumes:
  prometheus:
